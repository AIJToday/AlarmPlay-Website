<svg width="300" height="600" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1D29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B1426;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1426;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D29;stop-opacity:1" />
    </linearGradient>
    
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Phone Frame -->
  <rect x="25" y="25" width="250" height="550" rx="40" ry="40" fill="#2A2A2A" filter="url(#phoneShadow)"/>
  <rect x="35" y="35" width="230" height="530" rx="30" ry="30" fill="#000000"/>
  
  <!-- Screen -->
  <rect x="45" y="80" width="210" height="440" rx="20" ry="20" fill="url(#screenGradient)"/>
  
  <!-- Status Bar -->
  <rect x="45" y="80" width="210" height="30" fill="#0B1426"/>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">9:41</text>
  <text x="210" y="100" font-family="Arial, sans-serif" font-size="12" fill="#39FF14">100%</text>
  
  <!-- App Header -->
  <rect x="45" y="110" width="210" height="50" fill="#1A1D29"/>
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#39FF14" text-anchor="middle">AlarmPlay</text>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="10" fill="#8B93A1" text-anchor="middle">ALIEN INVASION</text>
  
  <!-- Main Alarm Display -->
  <rect x="60" y="180" width="180" height="120" rx="15" fill="#5B2C87" opacity="0.3"/>
  
  <!-- Time Display -->
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">06:00</text>
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="14" fill="#8B93A1" text-anchor="middle">AM</text>
  
  <!-- Mission Type -->
  <rect x="80" y="260" width="140" height="25" rx="12" fill="#39FF14" opacity="0.2"/>
  <text x="150" y="277" font-family="Arial, sans-serif" font-size="12" fill="#39FF14" text-anchor="middle">👽 ALIEN DEFENSE MISSION</text>
  
  <!-- UFO Animation Area -->
  <g transform="translate(150, 330)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#39FF14" opacity="0.6"/>
    <ellipse cx="0" cy="-5" rx="15" ry="8" fill="#FF6B9D" opacity="0.8"/>
    <circle cx="-10" cy="0" r="2" fill="#FFFFFF"/>
    <circle cx="10" cy="0" r="2" fill="#FFFFFF"/>
    <!-- Tractor beam -->
    <polygon points="-20,10 20,10 15,40 -15,40" fill="#39FF14" opacity="0.2"/>
  </g>
  
  <!-- Mission Description -->
  <rect x="60" y="380" width="180" height="60" rx="10" fill="#1A1D29"/>
  <text x="150" y="400" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Defend Earth from alien invasion!</text>
  <text x="150" y="415" font-family="Arial, sans-serif" font-size="9" fill="#8B93A1" text-anchor="middle">Complete 10 math problems to</text>
  <text x="150" y="428" font-family="Arial, sans-serif" font-size="9" fill="#8B93A1" text-anchor="middle">turn off the alarm</text>
  
  <!-- Action Button -->
  <rect x="70" y="460" width="160" height="40" rx="20" fill="#FF8C42"/>
  <text x="150" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SET ALARM</text>
  
  <!-- Bottom Navigation -->
  <rect x="45" y="520" width="210" height="50" fill="#1A1D29"/>
  <line x1="45" y1="520" x2="255" y2="520" stroke="#39FF14" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Nav Icons -->
  <g transform="translate(80, 540)">
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#39FF14" opacity="0.6"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" fill="#39FF14" text-anchor="middle">Alarms</text>
  </g>
  
  <g transform="translate(150, 540)">
    <circle cx="0" cy="0" r="8" fill="#8B93A1" opacity="0.4"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" fill="#8B93A1" text-anchor="middle">Missions</text>
  </g>
  
  <g transform="translate(220, 540)">
    <circle cx="0" cy="0" r="8" fill="#8B93A1" opacity="0.4"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" fill="#8B93A1" text-anchor="middle">Stats</text>
  </g>
  
  <!-- Home Indicator -->
  <rect x="135" y="555" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.3"/>
</svg>