<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B2C87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#39FF14;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- AlarmPlay Text -->
  <text x="50" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#logoGradient)" filter="url(#glow)">
    AlarmPlay
  </text>
  
  <!-- Alien Invasion Subtitle -->
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#39FF14" opacity="0.8">
    ALIEN INVASION
  </text>
  
  <!-- UFO Icon -->
  <g transform="translate(10, 15)">
    <!-- UFO Body -->
    <ellipse cx="15" cy="20" rx="18" ry="8" fill="url(#logoGradient)" opacity="0.9"/>
    <!-- UFO Dome -->
    <ellipse cx="15" cy="15" rx="8" ry="6" fill="#39FF14" opacity="0.7"/>
    <!-- Light Beam -->
    <polygon points="7,28 23,28 20,40 10,40" fill="#39FF14" opacity="0.3"/>
    <!-- UFO Details -->
    <circle cx="10" cy="20" r="2" fill="#FF6B9D" opacity="0.8"/>
    <circle cx="20" cy="20" r="2" fill="#FF6B9D" opacity="0.8"/>
  </g>
</svg>