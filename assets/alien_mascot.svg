<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="alienGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B2C87;stop-opacity:1" />
    </radialGradient>
    <filter id="alienGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Alien Head -->
  <ellipse cx="60" cy="50" rx="35" ry="40" fill="url(#alienGradient)" filter="url(#alienGlow)"/>
  
  <!-- Large Eyes -->
  <ellipse cx="48" cy="45" rx="12" ry="15" fill="#0B1426" opacity="0.9"/>
  <ellipse cx="72" cy="45" rx="12" ry="15" fill="#0B1426" opacity="0.9"/>
  
  <!-- Eye Pupils -->
  <ellipse cx="48" cy="47" rx="6" ry="8" fill="#39FF14" opacity="0.8"/>
  <ellipse cx="72" cy="47" rx="6" ry="8" fill="#39FF14" opacity="0.8"/>
  
  <!-- Eye Reflections -->
  <ellipse cx="50" cy="42" rx="2" ry="3" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="74" cy="42" rx="2" ry="3" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Antennae -->
  <line x1="45" y1="20" x2="43" y2="10" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="20" x2="77" y2="10" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>
  <circle cx="43" cy="8" r="3" fill="#FF6B9D"/>
  <circle cx="77" cy="8" r="3" fill="#FF6B9D"/>
  
  <!-- Mouth -->
  <ellipse cx="60" cy="65" rx="8" ry="4" fill="#0B1426" opacity="0.7"/>
  
  <!-- Nose dots -->
  <circle cx="57" cy="55" r="1.5" fill="#0B1426" opacity="0.5"/>
  <circle cx="63" cy="55" r="1.5" fill="#0B1426" opacity="0.5"/>
</svg>